name: Build and Deploy to Cloud86
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let an in-flight deploy finish rather than cancelling it half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build
        env:
          BASE_PATH: ""
        run: npm run build

      - name: Deploy to Cloud86 via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/ # Keep the trailing slash
          server-dir: /httpdocs/ # Adjust this to your target folder on Cloud86
          
