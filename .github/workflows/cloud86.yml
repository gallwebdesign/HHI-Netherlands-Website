name: Build and Deploy to Cloud86
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let an in-flight deploy finish rather than cancelling it half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build
        env:
          BASE_PATH: ''
        run: npm run build

      - name: Deploy to Cloud86 via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/ # Keep the trailing slash
          server-dir: /httpdocs/ # Adjust this to your target folder on Cloud86
          # The action mirrors build/ onto the server and DELETES what it does
          # not find there. api/contact.secret.php holds the contact form's SMTP
          # credentials, exists only on the server and is gitignored, so without
          # this exclusion the next deploy would wipe it and mail would silently
          # fall back to mail(). The default excludes are replaced wholesale
          # when this key is set, so the git/node ones are repeated here.
          #
          # ⚠️ img/gallery/** is the same kind of exclusion and matters just as
          # much. The ~950 gallery photos are uploaded to the server by FTP by
          # hand and are deliberately NOT in the repo, so a CI checkout builds
          # an EMPTY gallery — and without this line the mirror would delete
          # every uploaded photo on the next push to main. The build succeeds
          # in that state rather than failing, which is what makes it
          # dangerous: nothing would flag the loss until someone looked at
          # /media. Do not remove this without first putting the photos in the
          # repo or into the build another way.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/api/contact.secret.php
            **/img/gallery/**
