name: Build and Deploy to Cloud86

on:
  push:
    branches:
      - main # Change this if your main branch is named 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Update to match your project's Node version

      - name: Install Dependencies
        run: npm ci # 'npm ci' is preferred for automated builds over 'npm install'

      - name: Build Project
        run: npm run build

      - name: Deploy to Cloud86 via SSH
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "build/" # Change to "dist/" if your framework uses that folder name
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: ${{ secrets.TARGET_DIR }}
