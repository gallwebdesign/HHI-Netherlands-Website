# Preview deploy of the SvelteKit migration to GitHub Pages.
#
# This is a staging preview of unfinished work, NOT the live site —
# hhi-netherlands.com is still the legacy PHP site. The build is
# deliberately marked noindex so the preview cannot compete with the
# real site in search results or expose placeholder results as fact.
#
# THIS FILE MUST EXIST ON THE DEFAULT BRANCH (main). GitHub only
# registers a workflow it can see there; on a non-default branch alone
# it is never picked up and no run is ever created — no error, just
# silence. main is still the legacy static site, so this file is the
# one thing on it that belongs to the migration.
#
# It BUILDS the migration branch regardless, via the explicit ref
# below. Retarget that ref at Phase 7, or delete this workflow once
# real hosting is settled.
name: Deploy preview to Pages

# Branch the preview is built from. Not necessarily the branch this
# file lives on — see above.
env:
  DEPLOY_REF: sveltekit-migration

on:
  push:
    branches: [sveltekit-migration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Explicit ref: when this file is run from main (where GitHub
      # registers it), the default checkout would fetch main — the
      # legacy site, which has no package.json and cannot build.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # Project repos serve from /<repo>, so Kit needs the sub-path.
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # Keep the preview out of search engines. Overwrites the copy from
      # static/, which stays crawlable for the real host at Phase 7.
      - name: Mark preview noindex
        run: |
          printf '# Staging preview — not the live site.\nUser-agent: *\nDisallow: /\n' > build/robots.txt

      # Pages would otherwise run the output through Jekyll, which strips
      # files and folders beginning with an underscore — including
      # SvelteKit's _app directory, breaking every asset on the site.
      - name: Bypass Jekyll
        run: touch build/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
