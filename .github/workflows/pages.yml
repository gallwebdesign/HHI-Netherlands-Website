# Deploys the SvelteKit site to GitHub Pages.
#
# This is a staging preview, NOT the public site — hhi-netherlands.com
# is still the legacy PHP site, and index.html here is still a stub
# until Phase 6. The build is deliberately marked noindex so the
# preview cannot compete with the real site in search results or
# present the placeholder results as fact.
#
# THIS FILE MUST EXIST ON THE DEFAULT BRANCH (main). GitHub only
# registers a workflow it can see there; on a non-default branch alone
# it is never picked up and no run is ever created — no error, just
# silence.
#
# The migration landed on main in PR #2, so main is now what gets
# built and no explicit ref is needed. Delete this workflow once real
# hosting is settled.
name: Deploy preview to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # Project repos serve from /<repo>, so Kit needs the sub-path.
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # Keep the preview out of search engines. Overwrites the copy from
      # static/, which stays crawlable for the real host at Phase 7.
      - name: Mark preview noindex
        run: |
          printf '# Staging preview — not the live site.\nUser-agent: *\nDisallow: /\n' > build/robots.txt

      # Pages would otherwise run the output through Jekyll, which strips
      # files and folders beginning with an underscore — including
      # SvelteKit's _app directory, breaking every asset on the site.
      - name: Bypass Jekyll
        run: touch build/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
